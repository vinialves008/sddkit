name: 'Standard'

on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cd_prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.event_name == 'push' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[GRV]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version-file: .nvmrc
          registry-url: 'https://npm.pkg.github.com'
      - name: Create release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b release/${{ github.run_id }}
      - name: Install dependencies
        run: npm ci
      - name: News fragment
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          COMMIT_PATTERN='^(feat|fix|docs|style|refactor|perf|test|chore)(\([^)]*\))?:[[:space:]]+.+$'
          if [[ "$COMMIT_MESSAGE" =~ $COMMIT_PATTERN ]]; then
            CATEGORY="${BASH_REMATCH[1]}"
            if [ "$CATEGORY" = "feat" ]; then
              npm run release:minor -- --no-git.requireUpstream --no-git.commit --no-git.tag --no-git.push --no-github.release
            else
              npm run release:patch -- --no-git.requireUpstream --no-git.commit --no-git.tag --no-git.push --no-github.release
            fi
          else
            echo "No valid category found in commit message. Skipping news fragment creation."
            exit 0
          fi
      - name: Commit and push changes
        run: |
          git add .
          git commit -m "chore(release): pre-release version bump"
          git push --set-upstream origin release/${{ github.run_id }}
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --title "[GRV] Pre-release version bump" --body "This PR contains the pre-release version bump." --base main --head release/${{ github.run_id }}
  cd_release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    if: ${{ github.event_name == 'push' && github.event_name == 'push' && contains(github.event.head_commit.message, '[GRV]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Trigger Publish Workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yaml --ref main  